name: Test DOS v0.49 combined rerelease

on:
  push:
    branches:
      - fix/v049-combined-rerelease
    paths:
      - "tools/build_dos_v49_read_buffer.py"
      - "tests/test_build_dos_v49_read_buffer.py"
      - "docs/V49_READ_BUFFER.md"
      - ".github/workflows/test-dos-v49-combined-rerelease.yml"
      - ".github/workflows/release-dos-v49-read-buffer.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run v0.49 unit tests
        run: python -m unittest tests.test_build_dos_v49_read_buffer -v

      - name: Download exact v0.48 base
        run: |
          mkdir -p outputs/v48_release
          curl -L --fail --retry 3 \
            -o outputs/Wizardry7_Korean_0.48_topic_keys.zip \
            https://github.com/munument1/-KR-Wizardry7/releases/download/v0.48/Wizardry7_Korean_0.48_topic_keys.zip
          echo "a0990467c94e1c19bd4ad7432b4895b026accd1056bb983e3110d621ae5e3ba8  outputs/Wizardry7_Korean_0.48_topic_keys.zip" | sha256sum -c -
          unzip -q outputs/Wizardry7_Korean_0.48_topic_keys.zip -d outputs/v48_release

      - name: Build combined package
        run: |
          python tools/build_dos_v49_read_buffer.py \
            --v48-dir outputs/v48_release \
            --output-dir outputs/v49_combined \
            --zip-output outputs/Wizardry7_Korean_0.49.zip \
            | tee outputs/V49_BUILD_LOG.txt
          unzip -t outputs/Wizardry7_Korean_0.49.zip

      - name: Verify exact runtime scope
        run: |
          echo "4878ef941364e0d91e37e857a2c07946b648729849e178e7e7be7ac02a9216ee  outputs/v49_combined/DSAVANT/VPCVW.OVR" | sha256sum -c -
          echo "23cb96744b68998fddb1c8bf5b1fa61f9eca18f492f58318f324861b0217570a  outputs/v49_combined/DSAVANT/VTREA.OVR" | sha256sum -c -
          echo "54fa02f1e91b3086f2f8283fcbed07d21da8a86285be72c08806f23833b2d112  outputs/v49_combined/DSAVANT/DS.EXE" | sha256sum -c -
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import build_dos_v49_read_buffer as v49

          before = Path("outputs/v48_release/DSAVANT")
          after = Path("outputs/v49_combined/DSAVANT")
          changed = []
          for src in sorted(p for p in before.iterdir() if p.is_file()):
              if src.name == "korean_codebook.json":
                  continue
              dst = after / src.name
              if hashlib.sha256(src.read_bytes()).digest() != hashlib.sha256(dst.read_bytes()).digest():
                  changed.append(src.name)
          assert changed == ["VPCVW.OVR", "VTREA.OVR"], changed

          vtrea = (after / "VTREA.OVR").read_bytes()
          for offset in v49.VARIABLE_CENTER_SITES + v49.HALF_WIDTH_SITES:
              assert v49.call_target(vtrea, offset) == v49.WIDTH_ADAPTER
          assert v49.call_target(vtrea, v49.LOGICAL_SITE_MUST_REMAIN) == v49.STRLEN_TARGET

          report = json.loads(Path("outputs/v49_combined/UI_V49_REPORT.json").read_text(encoding="utf-8"))
          assert report["read_buffer_audit"]["new_overflow_count_entire_message_bank"] == 0
          assert report["ui_patch"]["output_sha256"] == v49.V49_VTREA_SHA256
          print("changed runtime files:", changed)
          PY

      - name: Upload combined test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizardry7-Korean-v049-combined-rerelease-test
          path: |
            outputs/Wizardry7_Korean_0.49.zip
            outputs/V49_BUILD_LOG.txt
            outputs/v49_combined/UI_V49_REPORT.json
          if-no-files-found: error
