name: Release DOS v0.44 Jan-Ette event-state fix

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_dos_v44_event_state_fix.py"
      - "tests/test_build_dos_v44_event_state_fix.py"
      - "docs/V44_JAN_ETTE_EVENT_ROOT_CAUSE.md"
      - ".github/workflows/release-dos-v44-event-state-fix.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run v0.44 static tests
        run: python -m unittest tests.test_build_dos_v44_event_state_fix -v

      - name: Download exact published v0.43 base
        run: |
          mkdir -p outputs/v43_release
          curl -L --fail --retry 3 \
            -o outputs/Wizardry7_Korean_0.43_parser_neutral.zip \
            https://github.com/munument1/-KR-Wizardry7/releases/download/v0.43/Wizardry7_Korean_0.43_parser_neutral.zip
          echo "66dc9fe86589a5fda4e819ae184a729c7c62162b783911825e590f78fe8d700c  outputs/Wizardry7_Korean_0.43_parser_neutral.zip" | sha256sum -c -
          unzip -q outputs/Wizardry7_Korean_0.43_parser_neutral.zip -d outputs/v43_release

      - name: Build v0.44 package
        run: |
          python tools/build_dos_v44_event_state_fix.py \
            --v43-dir outputs/v43_release \
            --output-dir outputs/v44_event_state_fix \
            --zip-output outputs/Wizardry7_Korean_0.44_event_state_fix.zip \
            | tee outputs/V44_BUILD_LOG.txt
          unzip -t outputs/Wizardry7_Korean_0.44_event_state_fix.zip
          sha256sum outputs/Wizardry7_Korean_0.44_event_state_fix.zip | tee outputs/V44_SHA256.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(
              Path("outputs/v44_event_state_fix/UI_V44_REPORT.json").read_text(encoding="utf-8")
          )
          root = report["root_cause"]
          vbase = Path("outputs/v44_event_state_fix/DSAVANT/VBASE.OVR").read_bytes()

          assert root["file"] == "VBASE.OVR"
          assert root["file_offset"] == "0x667B"
          assert root["v43_bytes"] == "B8 01 00"
          assert root["v44_bytes"] == "E8 4C 73"
          assert root["resident_target"] == "CS:2A11"
          assert vbase[0x667B:0x667E] == bytes.fromhex("E8 4C 73")
          assert hashlib.sha256(vbase).hexdigest() == "99fa1b3188cfb3585061ddbe34f136b57939b98250daacb4cec8146cd54db464"
          assert report["unchanged_payload_count"] == 19
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload v0.44 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizardry7-Korean-v0.44-verification
          path: |
            outputs/Wizardry7_Korean_0.44_event_state_fix.zip
            outputs/V44_SHA256.txt
            outputs/V44_BUILD_LOG.txt
            outputs/v44_event_state_fix/UI_V44_REPORT.json

      - name: Publish v0.44 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > outputs/V44_RELEASE_NOTES.md <<'EOF'
          ## 위저드리 7 DOS 한글화 0.44

          초반 초보 던전 방향에서 **자네트(Jan-Ette) 대신 H'Jenn-Ra/T'Rang 장면이 나오는 문제의 실제 원인**을 수정했습니다.

          ### 실제 원인

          v0.35부터 복사방지 질문을 Enter만 눌러 통과시키기 위해 `VBASE.OVR`의 원래 호출을 `mov ax,1`로 교체했습니다.

          ```text
          VBASE.OVR + 0x667B
          원본 GOG : E8 4C 73
          v0.35~0.43: B8 01 00
          ```

          하지만 원래 호출 대상인 resident `CS:2A11` 루틴은 성공/실패만 반환하는 함수가 아니었습니다. 정상 처리 중 다음 게임 상태 초기화도 수행합니다.

          ```text
          DS:1008 <- DS:59F8
          ```

          호출 전체를 `AX=1`로 대체하면서 이 상태 갱신까지 건너뛰었고, 그 결과 초반 필드에서 자네트 대신 H'Jenn-Ra/T'Rang 이벤트가 선택될 수 있었습니다.

          ### 0.44 수정

          - `VBASE.OVR + 0x667B`의 원래 3바이트 호출 `E8 4C 73` 복구
          - 나머지 v0.43 파일/바이트는 그대로 유지
          - v0.43의 parser-neutral 한글 인코딩과 장면 텍스트 깨짐 수정 유지
          - 실제 A/B 테스트에서 다음 순서로 원인을 확인
            - 한글 코어 + 순정 OVR: 자네트 정상
            - VMNPC만 v0.43: 자네트 정상
            - VBASE만 v0.43: H'Jenn-Ra 재현
            - VBASE의 해당 3바이트만 원복: 자네트 정상
            - 전체 v0.43 + 해당 3바이트만 원복: 자네트 정상

          따라서 이번 수정은 추정이 아니라 실제 실행 비교로 범위를 `VBASE.OVR`의 해당 호출까지 좁힌 결과입니다.

          ### 설치

          기존 게임 폴더를 백업한 뒤 ZIP 안의 `DSAVANT` 폴더를 GOG 위저드리 7 설치 폴더에 덮어쓰십시오.
          EOF

          if gh release view v0.44 >/dev/null 2>&1; then
            gh release edit v0.44 \
              --title "위저드리 7 DOS 한글화 0.44" \
              --notes-file outputs/V44_RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
            gh release upload v0.44 \
              outputs/Wizardry7_Korean_0.44_event_state_fix.zip \
              --clobber
          else
            gh release create v0.44 \
              outputs/Wizardry7_Korean_0.44_event_state_fix.zip \
              --title "위저드리 7 DOS 한글화 0.44" \
              --notes-file outputs/V44_RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
