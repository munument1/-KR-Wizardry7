name: Diagnose DOS v0.49 UI and book crash

on:
  push:
    branches:
      - fix/v049-ui-book-crash
    paths:
      - ".github/workflows/diagnose-v49-ui-book.yml"
      - "tools/audit_dos_ui_layout.py"
      - "tools/diagnose_dos_v49_ui_sites.py"
      - "tools/diagnose_dos_v49_book.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagnostic dependencies
        run: python -m pip install capstone

      - name: Download exact published v0.48 package
        run: |
          mkdir -p outputs/v48
          curl -L --fail --retry 3 \
            -o outputs/Wizardry7_Korean_0.48_topic_keys.zip \
            https://github.com/munument1/-KR-Wizardry7/releases/download/v0.48/Wizardry7_Korean_0.48_topic_keys.zip
          echo "a0990467c94e1c19bd4ad7432b4895b026accd1056bb983e3110d621ae5e3ba8  outputs/Wizardry7_Korean_0.48_topic_keys.zip" | sha256sum -c -
          unzip -q outputs/Wizardry7_Korean_0.48_topic_keys.zip -d outputs/v48

      - name: Audit remaining strlen and six-pixel UI sites
        run: |
          python tools/audit_dos_ui_layout.py outputs/v48/DSAVANT \
            --json-output outputs/v49_ui_layout_audit.json \
            | tee outputs/v49_ui_layout_audit.log

      - name: Disassemble gameplay UI candidates
        run: |
          python tools/diagnose_dos_v49_ui_sites.py outputs/v48/DSAVANT \
            --output outputs/v49_ui_site_disassembly.txt \
            | tee outputs/v49_ui_site_disassembly.log

      - name: Print gameplay-overlay candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = json.loads(Path("outputs/v49_ui_layout_audit.json").read_text(encoding="utf-8"))
          focus = {"VMAZE.OVR", "VTREA.OVR", "VBASE.OVR", "VPOPS.OVR", "VDOPT.OVR", "VMEXT.OVR"}
          for report in reports:
              if report["file"] not in focus:
                  continue
              print("\n===", report["file"], "===")
              for site in report.get("strlen_sites", []):
                  print(site["offset"], site["classification"], site["formula"])
                  for line in site["disassembly"]:
                      print(" ", line)
              print("six-pixel patterns:", report.get("six_pixel_patterns", []))
          PY

      - name: Run message/book structural diagnostics
        run: |
          python tools/diagnose_dos_v49_book.py outputs/v48/DSAVANT \
            --output outputs/v49_book_diagnostic.json \
            | tee outputs/v49_book_diagnostic.log

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Wizardry7-v049-diagnostics
          path: |
            outputs/v49_ui_layout_audit.json
            outputs/v49_ui_layout_audit.log
            outputs/v49_ui_site_disassembly.txt
            outputs/v49_ui_site_disassembly.log
            outputs/v49_book_diagnostic.json
            outputs/v49_book_diagnostic.log
          if-no-files-found: error
