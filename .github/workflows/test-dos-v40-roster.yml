name: Test DOS v40 roster decoder

on:
  push:
    branches:
      - main
      - fix/roster-korean-abbrev
    paths:
      - "src/dos_v40/**"
      - "tools/build_dos_v40_roster_abbrev.py"
      - "tests/test_build_dos_v40_roster_abbrev.py"
      - ".github/workflows/test-dos-v40-roster.yml"
  pull_request:
    paths:
      - "src/dos_v40/**"
      - "tools/build_dos_v40_roster_abbrev.py"
      - "tests/test_build_dos_v40_roster_abbrev.py"
      - ".github/workflows/test-dos-v40-roster.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GNU binutils
        run: |
          as --version
          ld --version
          objcopy --version
      - name: Run v40 roster tests
        run: python -m unittest tests.test_build_dos_v40_roster_abbrev -v
