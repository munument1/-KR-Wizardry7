name: Release DOS v0.42 scene-safe Korean encoding

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_dos_v42_scene_safe.py"
      - "tests/test_build_dos_v42_scene_safe.py"
      - ".github/workflows/release-dos-v42-scene-safe.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install pillow
      - name: Run v42 static tests
        run: python -m unittest tests.test_build_dos_v42_scene_safe -v
      - name: Download exact published v0.41 base
        run: |
          mkdir -p outputs/v41_release
          curl -L --fail --retry 3 \
            -o outputs/Wizardry7_Korean_0.41_roster_record_fix.zip \
            https://github.com/munument1/-KR-Wizardry7/releases/download/v0.41/Wizardry7_Korean_0.41_roster_record_fix.zip
          echo "34ab9d062206866ce1b2d347d3f6559dd7afcb7a26552b762b957e50d9dd5798  outputs/Wizardry7_Korean_0.41_roster_record_fix.zip" | sha256sum -c -
          unzip -q outputs/Wizardry7_Korean_0.41_roster_record_fix.zip -d outputs/v41_release
      - name: Build v0.42 package
        run: |
          python tools/build_dos_v42_scene_safe.py \
            --v41-dir outputs/v41_release \
            --output-dir outputs/v42_scene_safe \
            --zip-output outputs/Wizardry7_Korean_0.42_scene_safe.zip \
            | tee outputs/V42_BUILD_LOG.txt
          unzip -t outputs/Wizardry7_Korean_0.42_scene_safe.zip
          sha256sum outputs/Wizardry7_Korean_0.42_scene_safe.zip | tee outputs/V42_SHA256.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("outputs/v42_scene_safe/UI_V42_REPORT.json").read_text(encoding="utf-8"))
          tx = report["message_transcode"]
          assert tx["rank_payload_collisions_before"] > 0
          assert tx["rank_payload_collisions_after"] == 0
          assert tx["jan_ette_collisions_after"] == 0
          assert tx["padded_data_size"] == 262144
          print(json.dumps(tx, indent=2))
          PY
      - name: Upload v0.42 verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizardry7-Korean-v0.42-verification
          path: |
            outputs/Wizardry7_Korean_0.42_scene_safe.zip
            outputs/V42_SHA256.txt
            outputs/V42_BUILD_LOG.txt
            outputs/v42_scene_safe/UI_V42_REPORT.json
      - name: Publish v0.42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > outputs/V42_RELEASE_NOTES.md <<'EOF'
          ## 위저드리 7 DOS 한글화 0.42

          초반 필드에서 **자네트(Jan-Ette) 이벤트 대신 하젠라 트랭/H'Jenn-Ra 장면과 MON42 그림이 튀어나오고, 이어지는 한글이 노란 블록/깨진 문자열로 무너지는 문제**를 수정했습니다.

          ### 실제 원인

          한글 한 글자는 `0x17 + rank + rank` 3바이트로 저장되는데, 0.41까지는 두 rank 바이트에 장면 파서가 명령으로 사용하는 `! % & ] @ # |` 값이 들어갈 수 있었습니다.

          일반 문자열 렌더러는 이를 한글 한 글자로 처리하지만, 일부 필드/시네마 이벤트 제어 경로는 raw 바이트를 검사합니다. 그 결과 한글 내부 바이트가 실제 장면 명령으로 오인되어 **잘못된 그림/이벤트 분기**가 실행되고 이후 텍스트 스트림까지 깨질 수 있었습니다.

          ### 0.42 수정

          - 기존 0.41의 한국어 메시지를 Unicode로 역변환한 뒤 안전한 rank 코드로 전체 재인코딩
          - `! % & ] @ # |`를 한글 rank 바이트로 사용하지 않도록 예약
          - 실제 ASCII 장면 제어문자는 그대로 보존
          - 압축 효율 때문에 공백 `0x20`은 rank에 유지하되, 기존 0.39의 한글 인식 공백 검색 헬퍼로 안전하게 처리
          - DS.EXE의 역 rank 테이블과 alphabet 크기만 새 코드북에 맞게 갱신
          - 기존 글리프 순서는 변하지 않아 폰트 비트맵은 그대로 유지
          - 0.41 캐릭터 목록 M/F 경계 수정과 0.39 저장/오버레이 안전 수정 모두 유지
          - 전체 메시지에서 예약된 장면 제어 바이트가 **한글 rank 내부에 0개**인지 빌드 시 검증
          - 자네트 이벤트 메시지 ID `29600..29756`도 별도 회귀 검증

          ### 설치

          기존 게임 폴더를 백업한 뒤 ZIP 안의 `DSAVANT` 폴더를 GOG 위저드리 7 설치 폴더에 덮어씁니다.

          가능하면 새 게임 시작 후 초반 필드의 자네트 조우 장면까지 확인해 주세요. 정상이라면 여성 헬라조이드 전사 자네트가 등장하고, 하젠라 트랭/MON42 장면이 나오지 않아야 합니다.
          EOF

          if gh release view v0.42 >/dev/null 2>&1; then
            gh release edit v0.42 \
              --title "위저드리 7 DOS 한글화 0.42" \
              --notes-file outputs/V42_RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
            gh release upload v0.42 \
              outputs/Wizardry7_Korean_0.42_scene_safe.zip \
              --clobber
          else
            gh release create v0.42 \
              outputs/Wizardry7_Korean_0.42_scene_safe.zip \
              --title "위저드리 7 DOS 한글화 0.42" \
              --notes-file outputs/V42_RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
